<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabor Urbano | Menú Digital & Pedidos</title>
    <!-- Tailwind CSS desde CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#f59e0b',
                            600: '#d97706',
                        },
                        whatsapp: '#25D366'
                    }
                }
            }
        }
    </script>
    <!-- Iconos Phosphor -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Fuente Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Scrollbar personalizada */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
    </style>
</head>
<body class="bg-neutral-950 text-neutral-100 min-h-screen pb-28 select-none">

    <!-- ENCABEZADO Y HEADER PRINCIPAL -->
    <header class="relative bg-neutral-900 border-b border-neutral-800 sticky top-0 z-30 shadow-xl">
        <div class="max-w-md mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-600 flex items-center justify-center shadow-lg shadow-amber-500/20 font-black text-2xl text-neutral-950">
                    SU
                </div>
                <div>
                    <h1 class="font-extrabold text-lg text-white leading-tight">Sabor Urbano</h1>
                    <div class="flex items-center space-x-2 text-xs mt-0.5">
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1 animate-pulse"></span> Abierto
                        </span>
                        <span class="text-neutral-400">12:00 PM - 11:00 PM</span>
                    </div>
                </div>
            </div>
            <!-- Botón de contacto directo por WhatsApp -->
            <a href="https://wa.me/584120000000?text=Hola,%20quisiera%20hacer%20una%20consulta" target="_blank" rel="noopener noreferrer" class="p-2.5 rounded-xl bg-neutral-800 text-neutral-300 hover:text-white hover:bg-neutral-700 transition flex items-center justify-center border border-neutral-700/50">
                <i class="ph-bold ph-whatsapp-logo text-xl text-emerald-400"></i>
            </a>
        </div>

        <!-- SECCIÓN DE NAVEGACIÓN Y FILTROS -->
        <div class="max-w-md mx-auto px-4 pb-3 overflow-x-auto no-scrollbar flex space-x-2 scroll-smooth">
            <button onclick="filterCategory('todos')" class="category-btn active px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-amber-500 text-neutral-950 shadow-lg shadow-amber-500/20" data-cat="todos">
                🔥 Todos
            </button>
            <button onclick="filterCategory('combos')" class="category-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-neutral-800 text-neutral-400 border border-neutral-700/50 hover:bg-neutral-700" data-cat="combos">
                🎁 Combos
            </button>
            <button onclick="filterCategory('hamburguesas')" class="category-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-neutral-800 text-neutral-400 border border-neutral-700/50 hover:bg-neutral-700" data-cat="hamburguesas">
                🍔 Hamburguesas
            </button>
            <button onclick="filterCategory('perros')" class="category-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-neutral-800 text-neutral-400 border border-neutral-700/50 hover:bg-neutral-700" data-cat="perros">
                🌭 Perros Calientes
            </button>
            <button onclick="filterCategory('bebidas')" class="category-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-neutral-800 text-neutral-400 border border-neutral-700/50 hover:bg-neutral-700" data-cat="bebidas">
                🥤 Bebidas
            </button>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL DE PRODUCTOS -->
    <main class="max-w-md mx-auto px-4 pt-6 space-y-4" id="products-container">
        <!-- Los productos se cargarán dinámicamente desde JavaScript -->
    </main>

    <!-- BARRA INFERIOR FLOTANTE DEL CARRITO -->
    <div id="cart-bar" class="fixed bottom-4 left-0 right-0 max-w-md mx-auto px-4 z-40 transition-all duration-300 transform translate-y-28 opacity-0 pointer-events-none">
        <button onclick="openCartModal()" class="w-full bg-gradient-to-r from-amber-500 to-amber-600 text-neutral-950 p-4 rounded-2xl font-bold flex items-center justify-between shadow-2xl shadow-amber-500/30 active:scale-95 transition">
            <div class="flex items-center space-x-3">
                <div class="w-8 h-8 rounded-xl bg-neutral-950/20 flex items-center justify-center font-extrabold text-sm" id="cart-count">
                    0
                </div>
                <span class="text-sm font-extrabold tracking-wide uppercase">Ver Pedido</span>
            </div>
            <div class="text-base font-black" id="cart-total-bar">
                $0.00
            </div>
        </button>
    </div>

    <!-- MODAL / CARRITO INTERACTIVO -->
    <div id="cart-modal" class="fixed inset-0 bg-neutral-950/80 backdrop-blur-md z-50 flex items-end sm:items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-md rounded-t-3xl sm:rounded-3xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300" id="cart-modal-content">
            
            <!-- Encabezado del Modal -->
            <div class="p-4 border-b border-neutral-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <i class="ph-bold ph-shopping-bag-open text-xl text-amber-500"></i>
                    <h2 class="font-extrabold text-lg text-white">Resumen del Pedido</h2>
                </div>
                <button onclick="closeCartModal()" class="p-2 rounded-xl bg-neutral-800 text-neutral-400 hover:text-white">
                    <i class="ph-bold ph-x text-lg"></i>
                </button>
            </div>

            <!-- Lista de Ítems del Carrito -->
            <div class="p-4 overflow-y-auto flex-1 space-y-3" id="cart-items">
                <!-- Ítems agregados dinámicamente -->
            </div>

            <!-- Notas del Pedido -->
            <div class="px-4 py-2 border-t border-neutral-800/50">
                <label class="block text-xs font-semibold text-neutral-400 mb-1">Notas especiales (opcional):</label>
                <input type="text" id="order-notes" placeholder="Ej: Sin cebolla, salsas aparte..." class="w-full bg-neutral-950 border border-neutral-800 rounded-xl px-3 py-2 text-xs text-white placeholder-neutral-500 focus:outline-none focus:border-amber-500">
            </div>

            <!-- Total y Botón de Envío -->
            <div class="p-4 border-t border-neutral-800 bg-neutral-950/50 space-y-3">
                <div class="flex justify-between items-center text-sm font-bold">
                    <span class="text-neutral-400">Total a pagar:</span>
                    <span class="text-xl font-black text-amber-500" id="cart-total-modal">$0.00</span>
                </div>
                <button onclick="sendOrderWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-neutral-950 p-3.5 rounded-xl font-extrabold flex items-center justify-center space-x-2 shadow-lg shadow-emerald-500/20 active:scale-95 transition">
                    <i class="ph-bold ph-whatsapp-logo text-2xl"></i>
                    <span>Confirmar por WhatsApp</span>
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT / LÓGICA DE LA APLICACIÓN -->
    <script>
        // Configuración general del negocio (Ajustar con los datos reales del cliente)
        const PHONE_NUMBER = "584120000000"; // Número con código de país sin el símbolo '+'

        // Catálogo de Productos
        const products = [
            {
                id: 1,
                name: "Combo Urbano Doble",
                category: "combos",
                price: 9.99,
                desc: "Hamburguesa Doble Carne (200g), Queso Cheddar, Tocineta, Papas Fritas y Bebida 500ml.",
                image: "https://images.unsplash.com/photo-1594212699903-ec8a3eca50f6?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 2,
                name: "Burger Beast Crispy",
                category: "hamburguesas",
                price: 6.50,
                desc: "Pollo Crujiente, Queso Americano, Ensalada Coleslaw, Salsa Especial y Pan Brioche.",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 3,
                name: "Smash Cheese Special",
                category: "hamburguesas",
                price: 5.50,
                desc: "Doble carne Smash (120g), triple cheddar, cebolla caramelizada y salsa de la casa.",
                image: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 4,
                name: "Perro Caliente Gigante",
                category: "perros",
                price: 3.50,
                desc: "Salchicha Jumbo, Papita Rallada, Queso Peño, Cebolla, Tocineta y trío de salsas.",
                image: "https://images.unsplash.com/photo-1627054248810-cb55f5f9227c?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 5,
                name: "Perro Especial Gratinado",
                category: "perros",
                price: 4.50,
                desc: "Salchicha Polaca, fundido de Queso Mozzarella gratinado, tocineta crujiente y Maíz.",
                image: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=500&auto=format&fit=crop&q=60"
            },
            {
                id: 6,
                name: "Refresco 500ml",
                category: "bebidas",
                price: 1.50,
                desc: "Coca-Cola, Pepsi o Chinotto bien frío.",
                image: "https://images.unsplash.com/photo-1622483767028-3f66f32aef97?w=500&auto=format&fit=crop&q=60"
            }
        ];

        // Estado del Carrito
        let cart = {};

        // Inicializar Renderizado
        window.onload = () => {
            renderProducts(products);
        };

        // Renderizar Productos
        function renderProducts(items) {
            const container = document.getElementById('products-container');
            container.innerHTML = '';

            if (items.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-neutral-500 font-medium">No se encontraron productos en esta categoría.</div>`;
                return;
            }

            items.forEach(prod => {
                const card = document.createElement('div');
                card.className = "bg-neutral-900 border border-neutral-800 rounded-2xl overflow-hidden shadow-lg flex flex-col sm:flex-row transition hover:border-neutral-700";
                
                card.innerHTML = `
                    <div class="relative w-full sm:w-1/3 h-40 sm:h-auto overflow-hidden">
                        <img src="${prod.image}" alt="${prod.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x300/1e1e1e/FFF?text=Sabor+Urbano'">
                        <span class="absolute top-2 left-2 bg-neutral-950/80 backdrop-blur-md text-amber-400 font-extrabold text-xs px-2.5 py-1 rounded-lg border border-neutral-800">
                            $${prod.price.toFixed(2)}
                        </span>
                    </div>
                    <div class="p-4 flex-1 flex flex-col justify-between space-y-3">
                        <div>
                            <h3 class="font-extrabold text-base text-white">${prod.name}</h3>
                            <p class="text-xs text-neutral-400 mt-1 leading-relaxed">${prod.desc}</p>
                        </div>
                        <div class="flex items-center justify-between pt-2 border-t border-neutral-800/50">
                            <span class="text-base font-black text-white">$${prod.price.toFixed(2)}</span>
                            <button onclick="addToCart(${prod.id})" class="bg-amber-500 hover:bg-amber-600 text-neutral-950 font-extrabold text-xs px-3.5 py-2 rounded-xl flex items-center space-x-1 shadow-lg shadow-amber-500/10 active:scale-95 transition">
                                <i class="ph-bold ph-plus text-sm"></i>
                                <span>Agregar</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Filtrar por Categoría
        function filterCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if (btn.dataset.cat === cat) {
                    btn.className = "category-btn active px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-amber-500 text-neutral-950 shadow-lg shadow-amber-500/20";
                } else {
                    btn.className = "category-btn px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition-all duration-200 bg-neutral-800 text-neutral-400 border border-neutral-700/50 hover:bg-neutral-700";
                }
            });

            if (cat === 'todos') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.category === cat);
                renderProducts(filtered);
            }
        }

        // Agregar al Carrito
        function addToCart(id) {
            if (cart[id]) {
                cart[id].qty += 1;
            } else {
                const prod = products.find(p => p.id === id);
                cart[id] = { ...prod, qty: 1 };
            }
            updateCartUI();
        }

        // Modificar Cantidad
        function changeQty(id, delta) {
            if (cart[id]) {
                cart[id].qty += delta;
                if (cart[id].qty <= 0) {
                    delete cart[id];
                }
            }
            updateCartUI();
        }

        // Actualizar Interfaz del Carrito
        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartCount = document.getElementById('cart-count');
            const cartTotalBar = document.getElementById('cart-total-bar');
            const cartTotalModal = document.getElementById('cart-total-modal');
            const cartBar = document.getElementById('cart-bar');

            let total = 0;
            let count = 0;

            cartItemsContainer.innerHTML = '';

            Object.values(cart).forEach(item => {
                total += item.price * item.qty;
                count += item.qty;

                const itemRow = document.createElement('div');
                itemRow.className = "flex items-center justify-between bg-neutral-950 p-3 rounded-xl border border-neutral-800";
                itemRow.innerHTML = `
                    <div class="flex-1 pr-2">
                        <h4 class="font-bold text-xs text-white">${item.name}</h4>
                        <span class="text-xs text-amber-500 font-semibold">$${(item.price * item.qty).toFixed(2)}</span>
                    </div>
                    <div class="flex items-center space-x-2 bg-neutral-900 border border-neutral-800 rounded-lg p-1">
                        <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 flex items-center justify-center text-neutral-400 hover:text-white font-bold text-xs">-</button>
                        <span class="text-xs font-bold text-white px-1">${item.qty}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 flex items-center justify-center text-neutral-400 hover:text-white font-bold text-xs">+</button>
                    </div>
                `;
                cartItemsContainer.appendChild(itemRow);
            });

            cartCount.innerText = count;
            cartTotalBar.innerText = `$${total.toFixed(2)}`;
            cartTotalModal.innerText = `$${total.toFixed(2)}`;

            if (count > 0) {
                cartBar.classList.remove('translate-y-28', 'opacity-0', 'pointer-events-none');
            } else {
                cartBar.classList.add('translate-y-28', 'opacity-0', 'pointer-events-none');
                closeCartModal();
            }
        }

        // Controles Modal Carrito
        function openCartModal() {
            const modal = document.getElementById('cart-modal');
            const content = document.getElementById('cart-modal-content');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            content.classList.remove('translate-y-full');
        }

        function closeCartModal() {
            const modal = document.getElementById('cart-modal');
            const content = document.getElementById('cart-modal-content');
            content.classList.add('translate-y-full');
            setTimeout(() => {
                modal.classList.add('opacity-0', 'pointer-events-none');
            }, 200);
        }

        // Generar y Enviar Pedido por WhatsApp
        function sendOrderWhatsApp() {
            if (Object.keys(cart).length === 0) return;

            let message = "🍔 *NUEVO PEDIDO - SABOR URBANO* 🍔\n\n";
            let total = 0;

            Object.values(cart).forEach(item => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                message += `▪ *${item.qty}x* ${item.name} - $${subtotal.toFixed(2)}\n`;
            });

            const notes = document.getElementById('order-notes').value.trim();
            if (notes) {
                message += `\n📝 *Notas:* ${notes}\n`;
            }

            message += `\n💰 *TOTAL A PAGAR:* $${total.toFixed(2)}`;
            message += `\n\nQuedo a la espera de la confirmación para indicar dirección de entrega.`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
